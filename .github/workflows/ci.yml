name: CI

# Runs the v3 suite only (implementation plan 0.2). The frozen v2 corpus in
# test/V2 is deliberately not run here — it is exercised on demand against
# /v2-src via `pnpm test:v2`, and never against v3 source.
on:
  push:
    branches: [main, v3.0-dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from package.json's packageManager field
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `pnpm build` typechecks the library source; this covers test/, which
      # nothing else does — ts-jest runs transpile-only (isolatedModules), so
      # a type error in a test is otherwise invisible. That is how three
      # assertions in inference.test.ts came to be quietly false, and how the
      # driver-shape check in clients-types.test.ts is kept honest.
      - run: pnpm typecheck
      - run: pnpm test
      # The build has to stay green from Phase 0 on: it typechecks the whole
      # library source and prints the bundle-size report recorded per phase in
      # docs-dev/v3-specs/v3-implementation-plan.md
      - run: pnpm build
